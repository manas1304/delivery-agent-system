version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: delivery_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: delivery_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: delivery_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:


